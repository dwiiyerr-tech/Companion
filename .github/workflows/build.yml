name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK CLI tools
        run: |
          # Download and install Android SDK cmdline tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools latest
          echo "ANDROID_HOME=$GITHUB_WORKSPACE/latest" >> $GITHUB_ENV
          echo "$GITHUB_WORKSPACE/latest/bin" >> $GITHUB_PATH
          echo "Android SDK installed at $ANDROID_HOME"
          ls -la "$ANDROID_HOME/bin/"

      - name: Accept licenses
        run: |
          yes | sdkmanager --licenses 2>&1 | tail -5

      - name: Install SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          echo "Platform installed at $(ls "$ANDROID_HOME/platforms/" 2>/dev/null | head -1)"

      - name: Create gradle.properties
        run: |
          cat > gradle.properties << EOF
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF
          cat gradle.properties

      - name: Write local.properties
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          cat local.properties

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build Debug APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          echo "=== Environment ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "PATH=$PATH"
          echo "=== Checking SDK ==="
          ls -la "$ANDROID_HOME/platforms/android-34/" 2>/dev/null || echo "Platform not found"
          echo "=== Gradle version ==="
          ./gradlew --version
          echo "=== Running assembleDebug ==="
          ./gradlew assembleDebug --no-daemon --stacktrace -x lint

      - name: Check APK output
        if: always()
        run: |
          find . -name "*.apk" -type f 2>/dev/null | head -10
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "APK directory not found"

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-companion-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK CLI tools
        run: |
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q commandlinetools-linux-11076708_latest.zip
          mv cmdline-tools latest
          echo "ANDROID_HOME=$GITHUB_WORKSPACE/latest" >> $GITHUB_ENV
          echo "$GITHUB_WORKSPACE/latest/bin" >> $GITHUB_PATH
          echo "Android SDK installed at $ANDROID_HOME"

      - name: Install SDK components
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
          echo "Platform installed"

      - name: Write local.properties
        run: echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Run unit tests
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: |
          ./gradlew testDebugUnitTest --no-daemon --stacktrace -x lint

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/
          retention-days: 14
